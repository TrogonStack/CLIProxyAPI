name: trogonstack-sync

# Merges the newest stable upstream release tag into main.
# main = upstream release tag + our patch commits. This repo must never carry
# or push git tags: upstream's release and docker workflows trigger on tag
# pushes. Upstream tags are fetched into the runner only.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: trogonstack-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/router-for-me/CLIProxyAPI.git
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Pick newest stable upstream tag
        id: tag
        run: |
          git fetch --no-tags "$UPSTREAM" '+refs/tags/v*:refs/tags/v*'
          tag="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ -z "$tag" ]; then
            echo "No stable upstream tag found" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "refs/tags/$tag" HEAD; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "main already contains $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream tag
        id: merge
        if: steps.tag.outputs.up_to_date == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git merge --no-ff --no-edit -m "chore(sync): merge upstream $TAG" "refs/tags/$TAG"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflict=true" >> "$GITHUB_OUTPUT"
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          git merge --abort
          title="Upstream sync conflict: $TAG"
          {
            echo "Merging upstream $TAG into main hit conflicts."
            echo
            echo "Conflicting files:"
            sed 's/^/- /' "$RUNNER_TEMP/conflicts.txt"
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Resolve locally with: git merge $TAG, then push the result to main."
          } > "$RUNNER_TEMP/conflict-body.txt"
          # gh under GITHUB_TOKEN is non-interactive: pass the body by file so no
          # editor or prompt is needed, and skip labels that may not exist.
          existing="$(gh issue list --state open --limit 200 --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | length")"
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/conflict-body.txt"
          else
            echo "Open conflict issue already exists"
          fi
          exit 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.tag.outputs.up_to_date == 'false'
        with:
          go-version-file: go.mod
          cache: true

      # The full suite is run as is. If upstream later adds tests that need
      # credentials or network not available in CI, narrow this to a package
      # subset here instead of skipping verification.
      - name: Build and test
        id: verify
        if: steps.tag.outputs.up_to_date == 'false'
        continue-on-error: true
        run: |
          go build ./...
          go test ./...

      - name: Publish failing merge as a pull request
        if: steps.tag.outputs.up_to_date == 'false' && steps.verify.outcome == 'failure'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          branch="sync/$TAG"
          git fetch origin "$branch" || true
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          title="chore(sync): merge upstream $TAG"
          {
            echo "Merging upstream $TAG into main is clean but build or tests failed."
            echo
            echo "Failed run: $RUN_URL"
            echo
            echo "Fix on this branch, then merge it into main."
          } > "$RUNNER_TEMP/pr-body.txt"
          existing="$(gh pr list --state open --head "$branch" --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh pr create --base main --head "$branch" --title "$title" \
              --body-file "$RUNNER_TEMP/pr-body.txt"
          else
            echo "Open sync PR already exists"
          fi
          exit 1

      - name: Push main and build image
        if: steps.tag.outputs.up_to_date == 'false' && steps.verify.outcome == 'success'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # GITHUB_TOKEN cannot push commits that touch .github/workflows, and
          # upstream changes those every month or so. Say so in an issue
          # instead of leaving a bare red run.
          if ! git push origin HEAD:main; then
            title="Upstream sync needs a manual push: $TAG"
            if git diff --quiet HEAD^1 HEAD -- .github/workflows; then
              reason="The push to main was rejected."
            else
              reason="The merge changes .github/workflows, which GITHUB_TOKEN may not push."
            fi
            printf '%s\n\nRun: %s\n\nPush it locally with: git merge %s, then git push origin main.\n' \
              "$reason" "$RUN_URL" "$TAG" > "$RUNNER_TEMP/push-body.txt"
            existing="$(gh issue list --state open --limit 200 --json title \
              --jq "[.[] | select(.title == \"$title\")] | length")"
            if [ "$existing" = "0" ]; then
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/push-body.txt"
            fi
            exit 1
          fi
          # Pushes made with GITHUB_TOKEN do not trigger workflows, but
          # workflow_dispatch does, so start the image build explicitly.
          gh workflow run trogonstack-image.yml --ref main
          echo "Merged upstream $TAG into main and dispatched the image build" >> "$GITHUB_STEP_SUMMARY"
