name: trogonstack-sync

# Merges the newest stable upstream release tag into main every Friday, so the
# image is ready for the homelab Renovate batch on Saturday.
# main = upstream release tag + our patch commits. This repo must never carry
# or push git tags: upstream's release and docker workflows trigger on tag
# pushes. Upstream tags are fetched into the runner only.

on:
  schedule:
    - cron: '17 6 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  packages: read

concurrency:
  group: trogonstack-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/router-for-me/CLIProxyAPI.git
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-mise

      - name: Pick newest stable upstream tag
        id: tag
        run: mise run github:workflows:trogonstack-sync:pick-tag
      - name: Merge upstream tag
        id: merge
        if: steps.tag.outputs.up_to_date == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: mise run github:workflows:trogonstack-sync:merge-upstream
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.tag.outputs.up_to_date == 'false'
        with:
          go-version-file: go.mod
          cache: true

      # The full suite is run as is. If upstream later adds tests that need
      # credentials or network not available in CI, narrow this to a package
      # subset here instead of skipping verification.
      - name: Build and test
        id: verify
        if: steps.tag.outputs.up_to_date == 'false'
        continue-on-error: true
        run: mise run github:workflows:trogonstack-sync:verify
      - name: Publish failing merge as a pull request
        if: steps.tag.outputs.up_to_date == 'false' && steps.verify.outcome == 'failure'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: mise run github:workflows:trogonstack-sync:publish-pull-request
      - name: Push main and build image
        if: steps.tag.outputs.up_to_date == 'false' && steps.verify.outcome == 'success'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: mise run github:workflows:trogonstack-sync:push-main
      # Main may hold fork-only commits that were never released. The release
      # workflow is idempotent, so run it for HEAD when it has an image, and
      # build and release that commit when it has none.
      - name: Release current main
        if: steps.tag.outputs.up_to_date == 'true'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: mise run github:workflows:trogonstack-sync:release-current
