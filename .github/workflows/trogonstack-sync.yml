name: trogonstack-sync

# Merges the newest stable upstream release tag into main every Friday, so the
# image is ready for the homelab Renovate batch on Saturday.
# main = upstream release tag + our patch commits. This repo must never carry
# or push git tags: upstream's release and docker workflows trigger on tag
# pushes. Upstream tags are fetched into the runner only.

on:
  schedule:
    - cron: '17 6 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: read
  id-token: write

concurrency:
  group: trogonstack-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/router-for-me/CLIProxyAPI.git
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The environment is what lets this job read the Barnacle key, and only
    # from main. Barnacle opens the sync pull requests, so they run CI and may
    # change workflows, which GITHUB_TOKEN can do neither of.
    environment: github-app-barnacle
    steps:
      - name: Google Cloud auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: shp-terraform
          workload_identity_provider: projects/630372936919/locations/global/workloadIdentityPools/github-app-barnacle/providers/trogonstack

      - name: Barnacle key
        id: barnacle_key
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            private_key:shp-terraform/github-app-barnacle-trogonstack-private-key

      - name: Barnacle token
        id: barnacle
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BARNACLE_APP_CLIENT_ID }}
          private-key: ${{ steps.barnacle_key.outputs.private_key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-mise

      - name: Pick newest stable upstream tag
        id: tag
        run: mise run github:workflows:trogonstack-sync:pick-tag
      - name: Merge upstream tag
        id: merge
        if: steps.tag.outputs.up_to_date == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: mise run github:workflows:trogonstack-sync:merge-upstream
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.tag.outputs.up_to_date == 'false' && steps.merge.outputs.conflict == 'false'
        with:
          go-version-file: go.mod
          cache: true

      # The full suite is run as is. If upstream later adds tests that need
      # credentials or network not available in CI, narrow this to a package
      # subset here instead of skipping verification.
      - name: Build and test
        id: verify
        if: steps.tag.outputs.up_to_date == 'false' && steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        run: mise run github:workflows:trogonstack-sync:verify
      - name: Publish conflicting merge as a pull request
        if: steps.tag.outputs.up_to_date == 'false' && steps.merge.outputs.conflict == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REASON: it conflicts with main.
          BARNACLE_TOKEN: ${{ steps.barnacle.outputs.token }}
        run: mise run github:workflows:trogonstack-sync:publish-pull-request
      - name: Publish failing merge as a pull request
        if: steps.tag.outputs.up_to_date == 'false' && steps.verify.outcome == 'failure'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REASON: build or tests failed.
          BARNACLE_TOKEN: ${{ steps.barnacle.outputs.token }}
        run: mise run github:workflows:trogonstack-sync:publish-pull-request
      - name: Push main and build image
        if: steps.tag.outputs.up_to_date == 'false' && steps.verify.outcome == 'success'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BARNACLE_TOKEN: ${{ steps.barnacle.outputs.token }}
        run: mise run github:workflows:trogonstack-sync:push-main
      # Main may hold fork-only commits that were never released. The release
      # workflow is idempotent, so run it for HEAD when it has an image, and
      # build and release that commit when it has none.
      - name: Release current main
        if: steps.tag.outputs.up_to_date == 'true'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: mise run github:workflows:trogonstack-sync:release-current
